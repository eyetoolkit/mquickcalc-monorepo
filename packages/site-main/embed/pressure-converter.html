<main id="main-content" class="page"><h1 class="page-title">🌡️ Pressure Converter</h1>
<p class="lede">Tire pressure in psi, weather in millibars, blood pressure in mmHg, SCUBA in atmospheres — pressure has more units than any other measurement.</p>
<div class="calc-card">
<label for="val">Value</label><input id="val" class="input" type="number" inputmode="decimal" step="any" value="1">
<div style="margin-top:14px;"><label for="from">Convert from</label><select id="from" class="input">
<option value="psi" selected>Pound per square inch (psi)</option>
<option value="bar">Bar</option>
<option value="atm">Atmosphere (atm)</option>
<option value="kPa">Kilopascal (kPa)</option>
<option value="MPa">Megapascal (MPa)</option>
<option value="mmHg">Millimeter of mercury (mmHg)</option>
<option value="inHg">Inch of mercury (inHg)</option>
<option value="torr">Torr</option>
</select></div>
<div class="result show" id="result"><div class="result-headline"><div id="mainVal">—</div><div id="mainUnit"></div></div><p class="note" id="convNote" style="margin-top:10px;"></p></div>
<table class="conv-table" id="rows"></table>
<button id="resetBtn" class="btn" style="margin-top:14px;">Reset</button>
<p class="upd">Last updated <time datetime="2026-09-10">September 10, 2026</time> — conversions use exact ISO unit definitions.</p>
</div>

<script>
(function(){
  var U = [["psi", "Pound per square inch (psi)", 1.0], ["bar", "Bar", 14.5038], ["atm", "Atmosphere (atm)", 14.6959], ["kPa", "Kilopascal (kPa)", 0.145038], ["MPa", "Megapascal (MPa)", 145.038], ["mmHg", "Millimeter of mercury (mmHg)", 0.0193368], ["inHg", "Inch of mercury (inHg)", 0.491154], ["torr", "Torr", 0.0193368]];
  var inp=document.getElementById('val'), sel=document.getElementById('from'), tb=document.getElementById('rows'), big=document.getElementById('mainVal'), bigLbl=document.getElementById('mainUnit'), note=document.getElementById('convNote');
  function fmt(n){if(!isFinite(n))return '—';if(n===0)return '0';return Number(n.toPrecision(8)).toLocaleString('en-US',{maximumFractionDigits:8})}
  function factorOf(id){for(var i=0;i<U.length;i++)if(U[i][0]===id)return U[i][2];return 1}
  function labelOf(id){for(var i=0;i<U.length;i++)if(U[i][0]===id)return U[i][1];return id}
  function symOf(id){var l=labelOf(id);var m=/\(([^)]+)\)\s*$/.exec(l);var s=m?m[1].trim():l;var c=s.indexOf(',');return c>0?s.slice(0,c):s}
  var PRI='psi', ALT='bar';
  var PAIRS = {"psi": "bar", "bar": "psi", "atm": "kPa", "mmHg": "psi"};
  function render(){
    var v=parseFloat(inp.value)||0, from=sel.value;
    var base=v*factorOf(from);
    var rows='';
    for(var i=0;i<U.length;i++){
      var id=U[i][0], out=base/U[i][2], isFrom=(id===from);
      rows += '<tr'+(isFrom?' class="is-from"':'')+'><td>'+U[i][1]+'</td><td><strong>'+fmt(out)+'</strong></td></tr>';
    }
    tb.innerHTML=rows;
    var target=PAIRS[from]||((from===PRI)?ALT:PRI);
    big.textContent = fmt(base/factorOf(target));
    bigLbl.textContent = fmt(v) + ' ' + symOf(from) + ' in ' + labelOf(target);
    if(note) note.textContent='Converting from '+labelOf(from)+'. Change the unit to convert the other way.';
  }
  inp.addEventListener('input',render); sel.addEventListener('change',render);
  document.getElementById('resetBtn').addEventListener('click',function(){inp.value='1';sel.value='psi';render()});
  // URL param support: /{topic}/{from}-to-{to} redirects here
  (function(){
    var q=new URLSearchParams(window.location.search);
    var fromParam=q.get('from');
    var sel=document.getElementById('from');
    if(sel && fromParam){
      var opts=sel.getElementsByTagName('option');
      for(var i=0;i<opts.length;i++){
        if(opts[i].value===fromParam){
          sel.value=fromParam;
          sel.dispatchEvent(new Event('change'));
          break;
        }
      }
    }
  })();
  render();
})();
</script>
