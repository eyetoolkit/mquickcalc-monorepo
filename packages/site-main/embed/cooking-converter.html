<h1 class="page-title">Cooking Converter</h1>
    <p class="lede">American recipes use cups, British recipes use grams and gas marks, and most of the world uses milliliters. This converter handles the volume units and includes the oven temperature cross-reference that recipe translations usually leave out.</p>

    <div class="calc-card" id="calc-card">
      <label for="val">Amount</label>
      <input id="val" class="input" type="number" inputmode="decimal" step="any" value="1">

      <div style="margin-top:14px;">
        <label for="from">Convert from</label>
        <select id="from" class="input">
          <option value="ml">Milliliter (mL)</option>
          <option value="l">Liter (L)</option>
          <option value="tsp-us">Teaspoon (US)</option>
          <option value="tbsp-us">Tablespoon (US)</option>
          <option value="floz-us">Fluid ounce (US)</option>
          <option value="cup-us" selected>Cup (US, 240 mL recipe cup)</option>
          <option value="pt-us">Pint (US)</option>
          <option value="floz-uk">Fluid ounce (UK)</option>
          <option value="cup-uk">Cup (UK / metric, 250 mL)</option>
        </select>
      </div>

      <div id="result" class="result show">
        <div class="big" id="mainVal">—</div>
        <div class="dim" id="mainUnit"></div>

      </div>

      <table class="ref-table conv-table" style="margin-top:20px;">
        <thead><tr><th>Unit</th><th style="text-align:right;">Value</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
      <p class="note" id="convNote"></p>

      <div style="margin-top:14px;display:flex;gap:12px;flex-wrap:wrap;">
        <button id="resetBtn" class="btn ghost">Reset</button>
      </div>
    </div>
<script src="/js/site.js"></script>
<script>
(function () {
  var CUPS = { 'ml': 1, 'l': 1000, 'tsp-us': 4.92892159375, 'tbsp-us': 14.78676478125,
               'floz-us': 29.5735295625, 'cup-us': 236.5882365, 'floz-uk': 28.4130625,
               'cup-uk': 284.130625, 'pt-us': 473.176473 };
  var inp = document.getElementById('val');
  var sel = document.getElementById('from');
  var tb = document.getElementById('rows');
  var big = document.getElementById('mainVal');
  var bigLbl = document.getElementById('mainUnit');
  var LABEL = { 'ml': 'Milliliter (mL)', 'l': 'Liter (L)', 'tsp-us': 'Teaspoon (US)',
                'tbsp-us': 'Tablespoon (US)', 'floz-us': 'Fluid ounce (US)',
                'cup-us': 'Cup (US, 240 mL recipe cup)', 'floz-uk': 'Fluid ounce (UK)',
                'cup-uk': 'Cup (UK / metric, 250 mL)', 'pt-us': 'Pint (US)' };

  function fmt(n) {
    if (!isFinite(n)) return '—';
    if (n === 0) return '0';
    return Number(n.toPrecision(7)).toLocaleString('en-US', { maximumFractionDigits: 4 });
  }
  function render() {
    var v = parseFloat(inp.value);
    if (isNaN(v)) v = 0;
    var from = sel.value;
    var ml = v * CUPS[from];
    var rows = '';
    for (var k in CUPS) {
      rows += '<tr' + (k === from ? ' class="is-from"' : '') + '><td>' + LABEL[k] +
              '</td><td><strong>' + fmt(ml / CUPS[k]) + '</strong></td></tr>';
    }
    tb.innerHTML = rows;
    var target = from === 'cup-us' ? 'ml' : 'cup-us';
    big.textContent = fmt(ml / CUPS[target]);
    bigLbl.textContent = (target === 'ml' ? 'in milliliters (mL)' : 'in US cups');
  }
  inp.addEventListener('input', render);
  sel.addEventListener('change', render);
  document.getElementById('resetBtn').addEventListener('click', function () {
    inp.value = '1';
    sel.value = 'cup-us';
    render();
  });
  // URL param support: /{topic}/{from}-to-{to} redirects here
  (function(){
    var q=new URLSearchParams(window.location.search);
    var fromParam=q.get('from');
    var sel=document.getElementById('from');
    if(sel && fromParam){
      var opts=sel.getElementsByTagName('option');
      for(var i=0;i<opts.length;i++){
        if(opts[i].value===fromParam){
          sel.value=fromParam;
          sel.dispatchEvent(new Event('change'));
          break;
        }
      }
    }
  })();
  render();
})();
</script>
