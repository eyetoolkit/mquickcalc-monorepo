<h1 class="page-title">Volume Converter</h1>
    <p class="lede">Volume is where US and UK units quietly diverge: a US gallon is 3.785 L but an imperial gallon is 4.546 L, a 20% difference. This converter keeps both systems separate so you never mix them by accident.</p>

    <div class="calc-card" id="calc-card">
      <label for="val">Value</label>
      <input id="val" class="input" type="number" inputmode="decimal" step="any" value="1">

      <div style="margin-top:14px;">
        <label for="from">Convert from</label>
        <select id="from" class="input">
        <option value="ml"Milliliter (mL)></option>
        <option value="l"Liter (L)> selected</option>
        <option value="m3"Cubic meter (m³)></option>
        <option value="tsp-us"Teaspoon (US)></option>
        <option value="tbsp-us"Tablespoon (US)></option>
        <option value="floz-us"Fluid ounce (US)></option>
        <option value="cup-us"Cup (US)></option>
        <option value="pt-us"Pint (US)></option>
        <option value="qt-us"Quart (US)></option>
        <option value="gal-us"Gallon (US)></option>
        <option value="floz-uk"Fluid ounce (UK)></option>
        <option value="pt-uk"Pint (UK)></option>
        <option value="gal-uk"Gallon (UK / imperial)></option>
        </select>
      </div>

      <div id="result" class="result show">
        <div class="big" id="mainVal">—</div>
        <div class="dim" id="mainUnit"></div>

      </div>

      <table class="ref-table conv-table" style="margin-top:20px;">
        <thead><tr><th>Unit</th><th style="text-align:right;">Value</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
      <p class="note" id="convNote"></p>

      <div style="margin-top:14px;display:flex;gap:12px;flex-wrap:wrap;">
        <button id="resetBtn" class="btn ghost">Reset</button>
      </div>
    </div>
<script src="/js/site-core.js" defer></script>
  <script src="/js/site-icons.js" defer></script>
  <script src="/js/site-enhance.js" defer></script>
<script>
(function () {
  var U = [["ml", "Milliliter (mL)", 0.001], ["l", "Liter (L)", 1], ["m3", "Cubic meter (m³)", 1000], ["tsp-us", "Teaspoon (US)", 0.00492892159375], ["tbsp-us", "Tablespoon (US)", 0.01478676478125], ["floz-us", "Fluid ounce (US)", 0.0295735295625], ["cup-us", "Cup (US)", 0.2365882365], ["pt-us", "Pint (US)", 0.473176473], ["qt-us", "Quart (US)", 0.946352946], ["gal-us", "Gallon (US)", 3.785411784], ["floz-uk", "Fluid ounce (UK)", 0.0284130625], ["pt-uk", "Pint (UK)", 0.56826125], ["gal-uk", "Gallon (UK / imperial)", 4.54609]];
  var inp = document.getElementById('val');
  var sel = document.getElementById('from');
  var tb = document.getElementById('rows');
  var big = document.getElementById('mainVal');
  var bigLbl = document.getElementById('mainUnit');
  var note = document.getElementById('convNote');

  function fmt(n) {
    if (!isFinite(n)) return '—';
    if (n === 0) return '0';
    return Number(n.toPrecision(8)).toLocaleString('en-US', { maximumFractionDigits: 8 });
  }
  function factorOf(id) {
    for (var i = 0; i < U.length; i++) if (U[i][0] === id) return U[i][2];
    return 1;
  }
  function labelOf(id) {
    for (var i = 0; i < U.length; i++) if (U[i][0] === id) return U[i][1];
    return id;
  }
  // Short symbol for the headline, e.g. "Inch (in)" -> "in"
  function symOf(id) {
    var l = labelOf(id);
    var m = /\(([^)]+)\)\s*$/.exec(l);
    var s = m ? m[1] : l;
    var c = s.indexOf(',');
    return c > 0 ? s.slice(0, c) : s;
  }
  var PRI = 'floz-us';
  var ALT = 'l';
  // The headline picks the pair a human would actually ask for: hectares go to
  // acres, not to 107,639 square feet. Anything unlisted falls back to PRI/ALT.
  var PAIRS = {"gal-us": "l", "gal-uk": "l", "pt-uk": "ml", "floz-uk": "ml", "ml": "tsp-us"};
  function render() {
    var v = parseFloat(inp.value);
    if (isNaN(v)) v = 0;
    var from = sel.value;
    var base = v * factorOf(from);
    var rows = '';
    for (var i = 0; i < U.length; i++) {
      var id = U[i][0];
      var out = base / U[i][2];
      var isFrom = (id === from);
      rows += '<tr' + (isFrom ? ' class="is-from"' : '') + '>' +
              '<td>' + U[i][1] + '</td>' +
              '<td><strong>' + fmt(out) + '</strong></td>' +
              '</tr>';
    }
    tb.innerHTML = rows;
    // Headline shows the pair people actually search for: kg->lb, cm->in, GB->GiB.
    var target = PAIRS[from] || ((from === PRI) ? ALT : PRI);
    big.textContent = fmt(base / factorOf(target));
    bigLbl.textContent = fmt(v) + ' ' + symOf(from) + ' in ' + labelOf(target);
    if (note) note.textContent = 'Converting from ' + labelOf(from) + '. Change the unit to convert the other way — the whole table updates instantly.';
  }
  inp.addEventListener('input', render);
  sel.addEventListener('change', render);
  document.getElementById('resetBtn').addEventListener('click', function () {
    inp.value = '1';
    sel.value = 'l';
    render();
  });
  // URL param support: /{topic}/{from}-to-{to} redirects here
  (function(){
    var q=new URLSearchParams(window.location.search);
    var fromParam=q.get('from');
    var sel=document.getElementById('from');
    if(sel && fromParam){
      var opts=sel.getElementsByTagName('option');
      for(var i=0;i<opts.length;i++){
        if(opts[i].value===fromParam){
          sel.value=fromParam;
          sel.dispatchEvent(new Event('change'));
          break;
        }
      }
    }
  })();
  render();
})();
</script>
