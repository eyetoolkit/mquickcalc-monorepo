<h1 class="page-title">Temperature Converter</h1>
    <p class="lede">Celsius to Fahrenheit, Fahrenheit to Celsius, and Kelvin for scientific work. Temperature is the one conversion that cannot be done with a simple multiplier, because the scales have different zero points — this tool applies the correct formula in both directions.</p>

    <div class="calc-card" id="calc-card">
      <label for="val">Temperature</label>
      <input id="val" class="input" type="number" inputmode="decimal" step="any" value="100">

      <div style="margin-top:14px;">
        <label for="from">Convert from</label>
        <select id="from" class="input">
          <option value="c" selected>Celsius (°C)</option>
          <option value="f">Fahrenheit (°F)</option>
          <option value="k">Kelvin (K)</option>
        </select>
      </div>

      <div id="result" class="result show">
        <div class="big" id="mainVal">—</div>
        <div class="dim" id="mainUnit"></div>

      </div>

      <table class="ref-table conv-table" style="margin-top:20px;">
        <thead><tr><th>Unit</th><th style="text-align:right;">Value</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
      <p class="note" id="convNote"></p>

      <div style="margin-top:14px;display:flex;gap:12px;flex-wrap:wrap;">
        <button id="resetBtn" class="btn ghost">Reset</button>
      </div>
    </div>
<script src="/js/site-core.js" defer></script>
  <script src="/js/site-icons.js" defer></script>
  <script src="/js/site-enhance.js" defer></script>
<script>
(function () {
  var inp = document.getElementById('val');
  var sel = document.getElementById('from');
  var tb = document.getElementById('rows');
  var big = document.getElementById('mainVal');
  var bigLbl = document.getElementById('mainUnit');
  var UNITS = [['c', 'Celsius (°C)'], ['f', 'Fahrenheit (°F)'], ['k', 'Kelvin (K)']];

  function toC(v, from) {
    if (from === 'c') return v;
    if (from === 'f') return (v - 32) * 5 / 9;
    return v - 273.15;
  }
  function fromC(c, to) {
    if (to === 'c') return c;
    if (to === 'f') return c * 9 / 5 + 32;
    return c + 273.15;
  }
  function fmt(n) {
    if (!isFinite(n)) return '—';
    return Number(n.toPrecision(8)).toLocaleString('en-US', { maximumFractionDigits: 6 });
  }
  function render() {
    var v = parseFloat(inp.value);
    if (isNaN(v)) v = 0;
    var from = sel.value;
    var c = toC(v, from);
    var rows = '';
    for (var i = 0; i < UNITS.length; i++) {
      var id = UNITS[i][0];
      var out = fromC(c, id);
      rows += '<tr' + (id === from ? ' class="is-from"' : '') + '><td>' + UNITS[i][1] +
              '</td><td><strong>' + fmt(out) + '</strong></td></tr>';
    }
    tb.innerHTML = rows;
    // C<->F is the pair people search for; Kelvin reads better against Celsius.
    var target = (from === 'c') ? 'f' : 'c';
    big.textContent = fmt(fromC(c, target));
    bigLbl.textContent = 'in ' + (target === 'c' ? 'Celsius (°C)' : 'Fahrenheit (°F)');
  }
  inp.addEventListener('input', render);
  sel.addEventListener('change', render);
  document.getElementById('resetBtn').addEventListener('click', function () {
    inp.value = '100';
    sel.value = 'c';
    render();
  });
  // URL param support: /{topic}/{from}-to-{to} redirects here
  (function(){
    var q=new URLSearchParams(window.location.search);
    var fromParam=q.get('from');
    var sel=document.getElementById('from');
    if(sel && fromParam){
      var opts=sel.getElementsByTagName('option');
      for(var i=0;i<opts.length;i++){
        if(opts[i].value===fromParam){
          sel.value=fromParam;
          sel.dispatchEvent(new Event('change'));
          break;
        }
      }
    }
  })();
  render();
})();
</script>
