name: mQuickCalc Deploy

# Build monorepo + deploy all 4 sites to Cloudflare Pages
# Trigger: push to main, or manual dispatch
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      CF_ACCOUNT_ID: 00cb5cd6be4881053e57a338ce62de2f
      # CF API Token (Scoped, Pages write) — stored in repo secrets
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build monorepo
        run: node tools/build.mjs

      - name: Setup Wrangler
        run: npm install -g wrangler@latest

      - name: Deploy site-main → mquickcalc
        run: wrangler pages deploy packages/site-main --project-name=mquickcalc --commit-hash=${{ github.sha }}

      - name: Deploy site-finance → mquickcalc-finance
        run: wrangler pages deploy packages/site-finance --project-name=mquickcalc-finance --commit-hash=${{ github.sha }}

      - name: Deploy site-health → mquickcalc-health
        run: wrangler pages deploy packages/site-health --project-name=mquickcalc-health --commit-hash=${{ github.sha }}

      - name: Deploy site-insurance → mquickcalc-cover
        run: wrangler pages deploy packages/site-insurance --project-name=mquickcalc-cover --commit-hash=${{ github.sha }}
