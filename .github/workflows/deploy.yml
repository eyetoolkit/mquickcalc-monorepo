name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build all sites
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # wrangler 4.131+ requires Node >=22
          node-version: '22'

      - name: Build
        run: node tools/build.mjs

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # wrangler 4.131+ requires Node >=22
          node-version: '22'

      - name: Build (again, since previous job's files aren't shared)
        run: node tools/build.mjs

      - name: Setup Wrangler
        # Pin a specific recent version: 4.131+ fixes account-token /memberships 9106 issue
        # `wrangler@4` resolves to 4.86 (too old), need exact version.
        run: npm install wrangler@4.131.1 --no-save

      - name: Deploy site-main → mquickcalc.com
        run: |
          npx wrangler pages deploy packages/site-main \
            --project-name=mquickcalc \
            --branch=main \
            --commit-dirty=true \
            --commit-message="${{ github.event.head_commit.message }}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploy site-finance → finance.mquickcalc.com
        run: |
          npx wrangler pages deploy packages/site-finance \
            --project-name=mquickcalc-finance \
            --branch=main \
            --commit-dirty=true \
            --commit-message="${{ github.event.head_commit.message }}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploy site-health → health.mquickcalc.com
        run: |
          npx wrangler pages deploy packages/site-health \
            --project-name=mquickcalc-health \
            --branch=main \
            --commit-dirty=true \
            --commit-message="${{ github.event.head_commit.message }}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
